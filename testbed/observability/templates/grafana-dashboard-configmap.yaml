{{- if .Values.vibedDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-vibed-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "observability.labels" . | nindent 4 }}
data:
  vibed-overview.json: |-
{{ .Files.Get "dashboards/vibed-overview.json" | indent 4 }}
{{- end }}
