apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-operator-install" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "knative.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "knative.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.operator.installJob.serviceAccountName }}
      restartPolicy: OnFailure
      containers:
        - name: kubectl
          image: {{ .Values.operator.installJob.image | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "Ensuring namespaces exist..."
              for ns in {{ .Values.operator.namespace }} {{ .Values.serving.namespace }}; do
                kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
              done

              echo "Applying Knative Operator manifest:"
              echo "  {{ .Values.operator.manifestURL }}"
              kubectl apply -f {{ .Values.operator.manifestURL | quote }}

              echo "Waiting for knative-operator deployment to become Available..."
              kubectl -n {{ .Values.operator.namespace }} \
                wait --for=condition=Available --timeout=180s \
                deployment/knative-operator || \
              kubectl -n default \
                wait --for=condition=Available --timeout=180s \
                deployment/knative-operator

              echo "Waiting for KnativeServing CRD to be Established..."
              kubectl wait --for=condition=Established --timeout=60s \
                crd/knativeservings.operator.knative.dev

              echo "Applying KnativeServing CR..."
              cat <<KNATIVE_SERVING_EOF | kubectl apply -f -
              apiVersion: operator.knative.dev/v1beta1
              kind: KnativeServing
              metadata:
                name: knative-serving
                namespace: {{ .Values.serving.namespace }}
                labels:
                  app.kubernetes.io/managed-by: knative-helm-installer
                  app.kubernetes.io/instance: {{ .Release.Name }}
              spec:
                version: {{ .Values.knativeVersion | quote }}
                {{- with .Values.serving.highAvailability }}
                high-availability:
                  replicas: {{ .replicas }}
                {{- end }}
                {{- if .Values.serving.ingress.kourier.enabled }}
                ingress:
                  kourier:
                    enabled: true
                    service-type: {{ .Values.serving.ingress.kourier.serviceType }}
                {{- end }}
                {{- with .Values.serving.config }}
                config:
                  {{- range $cfgName, $cfg := . }}
                  {{ $cfgName }}:
                    {{- range $k, $v := $cfg }}
                    {{ $k | quote }}: {{ $v | quote }}
                    {{- end }}
                  {{- end }}
                {{- end }}
              KNATIVE_SERVING_EOF

              echo "Done."
          resources:
            {{- toYaml .Values.operator.installJob.resources | nindent 12 }}
