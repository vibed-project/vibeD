{{- if and .Values.serving.ingress.kourier.enabled (eq .Values.serving.ingress.kourier.serviceType "NodePort") }}
# Patch the kourier gateway service to pin a NodePort. The operator creates the
# service; this companion job rewrites the http2 port once it exists. Runs after
# the KnativeServing CR reconciles.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-kourier-nodeport" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "knative.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: {{ .Values.operator.installJob.serviceAccountName }}
      restartPolicy: OnFailure
      containers:
        - name: kubectl
          image: {{ .Values.operator.installJob.image | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # The Knative Operator deploys Kourier into the same namespace as
              # KnativeServing (knative-serving), not the standalone Kourier
              # `kourier-system` namespace.
              KOURIER_NS="{{ .Values.serving.namespace }}"
              echo "Waiting for kourier service in ${KOURIER_NS}..."
              for i in $(seq 1 60); do
                if kubectl -n "${KOURIER_NS}" get svc kourier >/dev/null 2>&1; then
                  break
                fi
                sleep 5
              done
              kubectl -n "${KOURIER_NS}" patch service kourier --type merge -p \
                '{"spec":{"type":"NodePort","ports":[{"name":"http2","port":80,"targetPort":8080,"nodePort":{{ .Values.serving.ingress.kourier.httpNodePort }},"protocol":"TCP"}]}}'
          resources:
            {{- toYaml .Values.operator.installJob.resources | nindent 12 }}
{{- end }}
{{- if .Values.waitForReady.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-wait-for-ready" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "knative.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: {{ .Values.operator.installJob.serviceAccountName }}
      restartPolicy: OnFailure
      containers:
        - name: kubectl
          image: {{ .Values.operator.installJob.image | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              kubectl -n {{ .Values.serving.namespace }} \
                wait --for=condition=Ready --timeout={{ .Values.waitForReady.timeoutSeconds }}s \
                knativeserving/knative-serving
          resources:
            {{- toYaml .Values.operator.installJob.resources | nindent 12 }}
{{- end }}
