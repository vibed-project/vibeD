{{- range $alias := .Values.aliases }}
{{- if $alias.createNamespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $alias.namespace }}
  labels:
    {{- include "kindRegistry.labels" $ | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Values.name }}
  namespace: {{ $alias.namespace }}
  labels:
    {{- include "kindRegistry.labels" $ | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ printf "%s.%s.svc.cluster.local" $.Values.name $.Values.namespace }}
  ports:
    - port: {{ $.Values.servicePort }}
{{- end }}
