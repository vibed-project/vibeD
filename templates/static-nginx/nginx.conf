worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Buffer log to memory under /tmp so non-root nginx (UID 101) can write.
    access_log /tmp/access.log;
    error_log  /tmp/error.log warn;

    sendfile on;
    keepalive_timeout 30s;

    server {
        listen 8080;
        server_name _;

        root /workspace;
        index index.html;

        # Single-page-app fallback: anything that doesn't resolve to a real
        # file falls back to index.html so client-side routing works for
        # things like react-router and svelte-router.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
