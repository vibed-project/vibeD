worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # All writable paths live under /tmp so nginx runs under a
    # readOnlyRootFilesystem with only a /tmp volume (no /var/cache/nginx,
    # /var/run, etc.). Sandbox pods mount /tmp as an emptyDir.
    access_log /tmp/access.log;
    error_log  /tmp/error.log warn;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile on;
    keepalive_timeout 30s;

    server {
        listen 8080;
        server_name _;

        root /workspace;
        index index.html;

        # Single-page-app fallback: anything that doesn't resolve to a real
        # file falls back to index.html so client-side routing works for
        # things like react-router and svelte-router.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
