# python-313 — general-lane warm pool for Python app deploys (classifier
# rule 6). Pinned to extensions.agents.x-k8s.io/v1alpha1
# (kubernetes-sigs/agent-sandbox v0.4.5+). See refactor.md §6.1.
---
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: python-313
  namespace: vibed-pools
  labels:
    vibed.dev/template: python-313
    vibed.dev/lane: general
spec:
  envVarsInjectionPolicy: Allowed
  podTemplate:
    metadata:
      labels:
        vibed.dev/template: python-313
    spec:
      runtimeClassName: kata-qemu
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: runtime
          image: localhost/vibed-template-python-313:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: control, containerPort: 9000 }
            - { name: http,    containerPort: 8080 }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: pip-cache, mountPath: /home/runner/.cache/pip }
            - { name: tmp,       mountPath: /tmp }
      volumes:
        - { name: workspace, emptyDir: { sizeLimit: 100Mi } }
        - { name: pip-cache, emptyDir: { sizeLimit: 200Mi } }
        - { name: tmp,       emptyDir: { sizeLimit:  64Mi } }
---
# 50 idle replicas per refactor.md §6.1.
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxWarmPool
metadata:
  name: python-313
  namespace: vibed-pools
  labels:
    vibed.dev/template: python-313
    vibed.dev/lane: general
spec:
  replicas: 50
  sandboxTemplateRef:
    name: python-313
  updateStrategy:
    type: OnReplenish
