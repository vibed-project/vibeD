# Local Kind dev overlay for the v0.3.1 stack.
#
#   helm upgrade --install vibed deploy/helm/vibed -n vibed-system \
#     -f deploy/helm/vibed/values-kind.yaml
#
# Kind has no Kata, so runtime.defaultClass is empty (warm pools run as
# normal pods). Only the lightweight static-nginx pool is enabled to keep
# image builds small; workerd is off. All images are the locally built :dev
# tags loaded via `kind load`, pulled Never.

image:
  repository: localhost/vibed
  tag: dev
  pullPolicy: Never

service:
  type: NodePort
  nodePort: 31808

runtime:
  defaultClass: ""          # no Kata on Kind → schedule as normal pods
  installRuntimeClass: false
  # Open sandbox networking so the controller can probe the agent, the agent
  # can pull source from the in-cluster blob store, and Caddy can proxy.
  sandboxNetworkPolicy: Unmanaged

# (Single workloads namespace is now the chart default — vibed-apps — so no
# namespace override is needed here.)

controller:
  image: { repository: localhost/vibed-controller, tag: dev, pullPolicy: Never }
  domain: localhost
  # Dev URLs are http://<label>.localhost — port 80 implicit. Caddy is
  # exposed as NodePort 31080 below, and kind's extraPortMappings bridge
  # host:80 → 31080, so a browser hits the deployed app with no port-forward.
  urlScheme: http
  urlPort: ""

router:
  image: { repository: localhost/vibed-router, tag: dev, pullPolicy: Never }

caddy:
  # stock upstream caddy image; no DNS-01 on dev (plain HTTP).
  image: { repository: caddy, tag: 2-alpine, pullPolicy: IfNotPresent }
  # NodePort 31080 matches kind-config.yaml extraPortMappings host:80 →
  # container:31080. Browsers can hit deployed apps at http://<id>.localhost.
  service:
    type: NodePort
    httpNodePort: 31080
  tls:
    dns01:
      enabled: false

workerd:
  enabled: false

# Only static-nginx is built + loaded for this test; disable the rest so the
# controller doesn't claim against pools whose images aren't present.
# Warm pools for the dev cluster. The three common app shapes — static sites,
# JS/Node and Python — are ON by default so a deploy of any of them works out
# of the box; without a pool the app fails with TemplateMissing and never gets
# a pod (so there are no logs to explain it). `make install-vibed` builds and
# loads the matching localhost images.
#
# The general lane runs as normal pods here (runtime.defaultClass is "" above,
# so no Kata runtimeClassName is set) — no nested virt needed on Kind.
#
# go-123 and base-al2023 stay off: heavier images, rarely needed in dev. Turn
# one on with `helm upgrade --reuse-values --set warmPools.go-123.enabled=true`
# after building its image.
warmPools:
  static-nginx: { enabled: true,  lane: fast,    image: "localhost/vibed-template-static-nginx:dev", replicas: 2, resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } } }
  node-24:      { enabled: true,  lane: general, image: "localhost/vibed-runner-node:dev",           replicas: 2, resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } } }
  python-313:   { enabled: true,  lane: general, image: "localhost/vibed-runner-python:dev",         replicas: 2, resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } } }
  go-123:       { enabled: false }
  base-al2023:  { enabled: false }

config:
  server:
    transport: "http"
    baseURL: "http://localhost:31808"
  store:
    backend: "sqlite"
    sqlite:
      path: "/data/vibed/vibed.db"
  storage:
    tarball:
      backend: "served"
      served:
        # Empty -> the chart defaults this to the in-cluster Service DNS name
        # (http://vibed.vibed-system.svc.cluster.local:8080). In dev the
        # sandboxes run Unmanaged (no agent-sandbox NetworkPolicy) so they keep
        # normal cluster DNS and can resolve it. The DNS name is stable across
        # reinstalls — don't hardcode the Service ClusterIP, which changes every
        # `helm install` and silently breaks the agent's source pull.
        publicBaseURL: ""
