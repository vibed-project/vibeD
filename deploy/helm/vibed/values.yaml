# -- Number of vibeD replicas. Set >= 2 for high availability in production.
replicaCount: 1

image:
  repository: vibed
  # -- Image tag. IMPORTANT: Always pin to a specific version in production
  # (e.g. "0.1.0"). Using "latest" risks deploying untested code.
  tag: "latest"
  # -- Pull policy. Use "Always" in production to ensure the pinned tag
  # is re-fetched if the registry image was updated.
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  # -- NodePort number when service.type is NodePort (used by dev setup).
  nodePort: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: vibed.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: vibed-tls
    #   hosts:
    #     - vibed.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# -- Pod-level security context. Applies to all containers in the pod.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534       # nobody
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context for the vibed container.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""

# === v0.3.1 data-plane topology =============================================

# -- Data-plane namespace. refactor.md §7.1 split this into vibed-pools (warm
#    pools) + vibed-apps (claimed sandboxes), but agent-sandbox binds a
#    SandboxClaim only within the namespace its SandboxTemplate lives in (no
#    cross-namespace pod move), so VibedApps, claims, templates, and warm
#    pools must all share one namespace. `apps` is that workloads namespace;
#    `pools` defaults to the same value and exists only for back-compat.
#    The control plane (server / controller / router / caddy) runs in
#    .Release.Namespace.
namespaces:
  create: true
  apps: vibed-apps     # VibedApps + SandboxClaims + SandboxTemplates + warm pools
  pools: vibed-apps    # back-compat alias; keep equal to apps

# -- Kata RuntimeClass for the general lane. Off by default — most clusters
#    install it via their Kata operator. Set installRuntimeClass=true to let
#    Helm own it.
runtime:
  defaultClass: kata-qemu      # kata-qemu (dev, no nested virt) | kata-fc (KVM)
  installRuntimeClass: false
  handler: ""                  # defaults to defaultClass
  nodeSelector: {}             # e.g. { vibed.dev/sandbox-node: "true" }
  # agent-sandbox NetworkPolicy mode for warm-pool sandboxes:
  #   Managed   — agent-sandbox owns the policy: ingress only from an
  #               `app: sandbox-router` pod (which it doesn't ship) and NO
  #               cluster-internal egress. That blocks vibeD's controller
  #               probe, Caddy proxy, and the in-cluster "served" source pull.
  #   Unmanaged — agent-sandbox leaves networking to you. Use this with
  #               networkPolicy.enabled below so vibeD owns a policy that
  #               permits exactly its traffic. (Dev/Kind: Unmanaged + no
  #               policy = fully open.)
  sandboxNetworkPolicy: Managed

# -- vibeD-owned sandbox NetworkPolicy (the production posture). Default-deny,
#    then allow the control plane -> sandbox (:8080/:9000) and DNS + public
#    egress (for the agent's pre-signed S3 source pull) while blocking
#    cluster-internal egress. Pair with runtime.sandboxNetworkPolicy=Unmanaged
#    and config.storage.tarball.backend=s3. Off by default.
networkPolicy:
  enabled: false
  extraEgress: []   # additional egress rules (e.g. an in-cluster MinIO CIDR)

# -- vibed-controller: reconciles VibedApp -> SandboxClaim / workerd.
controller:
  enabled: true
  replicaCount: 1
  leaderElect: true
  image:
    repository: vibed-controller
    tag: "latest"
    pullPolicy: IfNotPresent
  # -- DNS suffix for app URLs; must match router/Caddy + your wildcard cert.
  domain: vibed.example.com
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }

# -- vibed-router: watches VibedApp status, programs Caddy routes.
router:
  enabled: true
  replicaCount: 1
  image:
    repository: vibed-router
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 200m, memory: 128Mi }

# -- Caddy: the wildcard reverse proxy for *.{controller.domain}. The router
#    drives its routes via the admin API (:2019).
caddy:
  enabled: true
  replicaCount: 1
  image:
    repository: caddy
    tag: "2-alpine"
    pullPolicy: IfNotPresent
  # -- DNS-01 wildcard TLS. When false, Caddy serves plain HTTP (dev). For
  #    production set provider + the token secret and use a Caddy image built
  #    with the matching DNS plugin (e.g. caddy-dns/cloudflare).
  tls:
    dns01:
      enabled: false
      provider: cloudflare
      tokenSecret: ""   # Secret with key CF_API_TOKEN
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: "1", memory: 256Mi }

# -- workerd fast lane (refactor.md §5.6). Disabled by default; needs a
#    workerd image (no official slim image — build one).
workerd:
  enabled: false
  replicas: 3
  controlPort: 9200
  portBase: 9100
  image:
    repository: ghcr.io/vibed-project/workerd
    tag: "dev"
    pullPolicy: IfNotPresent
  loaderImage:
    repository: vibed-workerd-loader
    tag: "latest"
    pullPolicy: IfNotPresent

# -- Warm pools: one SandboxTemplate + SandboxWarmPool per language template
#    (refactor.md §6.1), rendered into namespaces.pools. Set replicas to size
#    each pool; image must embed vibed-agent.
warmPools:
  node-24:      { enabled: true,  lane: general, image: "vibed-runner-node:dev",   replicas: 50, resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } } }
  python-313:   { enabled: true,  lane: general, image: "vibed-runner-python:dev", replicas: 50, resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } } }
  go-123:       { enabled: true,  lane: general, image: "vibed-template-go-123:dev",      replicas: 20, resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } } }
  base-al2023:  { enabled: true,  lane: general, image: "vibed-template-base-al2023:dev", replicas: 30, resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } } }
  static-nginx: { enabled: true,  lane: fast,    image: "vibed-template-static-nginx:dev", replicas: 30, resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } } }

config:
  server:
    transport: "http"
    httpAddr: ":8080"
    baseURL: ""  # public-facing URL for share link generation, e.g. "http://localhost:31808"
    rateLimit:
      enabled: false
      requestsPerSecond: 10
      burst: 20
  deployment:
    preferredTarget: "auto"
    namespace: "default"
    # -- How long deployers wait for a workload (Sandbox / K8s Deployment)
    #     to become Ready before failing the deploy. Cold image pulls +
    #     Sandbox reconcile can take several minutes; the default is
    #     intentionally generous.
    readyTimeout: "10m"
  builder:
    engine: "buildah"
    image: "paketobuildpacks/builder-jammy-base:latest"
    pullPolicy: "if-not-present"
    containerRuntime: "auto"
    buildah:
      image: "quay.io/buildah/stable:latest"
      timeout: "10m"
      insecure: true  # kind-registry is HTTP-only
  storage:
    backend: "local"
    local:
      basePath: "/data/vibed/artifacts"
    # -- Source-blob store for the /v1/deploy path.
    #    "served" keeps the tarball on vibeD's PVC and serves it at an
    #      in-cluster URL — DEV ONLY. Once a restrictive sandbox NetworkPolicy
    #      is in place (networkPolicy.enabled, or agent-sandbox Managed),
    #      sandboxes can't reach in-cluster services or resolve cluster DNS,
    #      so the agent can't pull from it.
    #    "s3" streams to S3/MinIO and hands the agent a pre-signed URL the
    #      sandbox reaches over its allowed public egress — REQUIRED IN
    #      PRODUCTION.
    #    publicBaseURL (served) defaults to the in-cluster Service URL.
    tarball:
      backend: "served"
      served:
        basePath: "/data/vibed/sources"
        publicBaseURL: ""   # empty -> http://<svc>.<ns>.svc.cluster.local:<port>
      s3:
        endpoint: ""
        bucket: ""
        region: ""
        presignTTL: "15m"
  registry:
    enabled: true
    url: "kind-registry:5000"
    insecure: true  # kind-registry is HTTP-only
  store:
    backend: "configmap"  # "sqlite" for share links, "configmap" for configmap-only
    sqlite:
      path: "/data/vibed/vibed.db"  # path inside the container (should be on a PVC)
    configmap:
      name: "vibed-artifacts"
      namespace: ""  # Defaults to release namespace
  # -- Resource limits for MCP tool inputs.
  limits:
    # -- Max total file content size in bytes (default: 50 MB).
    maxTotalFileSize: 52428800
    # -- Max number of files per deploy/update request (default: 500).
    maxFileCount: 500
    # -- Max log lines per request (default: 10000).
    maxLogLines: 10000
  # -- OpenTelemetry distributed tracing configuration.
  tracing:
    enabled: false
    # -- OTLP gRPC endpoint (e.g. "http://jaeger:4317"). Empty = stdout exporter.
    endpoint: ""
    # -- Sampling rate 0.0–1.0 (default: 1.0 = sample all).
    sampleRate: 1.0

  # -- Garbage collector for orphaned K8s resources (Jobs, ConfigMaps,
  #     Deployments, Sandboxes) whose artifact is gone.
  gc:
    enabled: true
    # -- How often the GC sweep runs (Go duration string).
    interval: "5m"
    # -- Resources younger than this are kept even if their artifact is gone.
    maxAge: "1h"
    # -- When true, log what would be deleted but don't delete.
    dryRun: false

persistence:
  enabled: true
  size: 5Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

metrics:
  enabled: true
  # -- ServiceMonitor for Prometheus Operator. Requires the Prometheus Operator
  # CRDs to be installed in the cluster. Alternative to annotation-based scraping.
  serviceMonitor:
    enabled: false
    interval: 30s
    # -- Extra labels for ServiceMonitor selector matching
    labels: {}
  # -- PrometheusRule for alerting. Requires the Prometheus Operator CRDs.
  prometheusRule:
    enabled: false
    # -- Extra labels for PrometheusRule selector matching
    labels: {}

# -- Authentication for MCP and API endpoints.
# IMPORTANT: Enable auth before exposing vibeD outside the cluster.
auth:
  # -- Set to true to require API key authentication.
  enabled: false
  mode: "apikey"              # "apikey", "oauth", or "oidc"
  existingSecret: ""          # Use existing K8s Secret for API key (key: "api-key")
  # -- OIDC configuration (when mode: "oidc")
  oidc:
    issuer: ""                # OIDC issuer URL (e.g. "https://keycloak.example.com/realms/vibed")
    audience: ""              # Expected audience claim
    usernameClaim: "preferred_username"
    emailClaim: "email"
    roleClaim: "realm_access.roles"
    adminRole: "vibed-admin"
    scopes:
      - "openid"
      - "profile"
  tls:
    enabled: false
    existingSecret: ""        # Use existing K8s Secret for TLS certs (tls.crt, tls.key)
