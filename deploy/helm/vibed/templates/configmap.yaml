apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vibed.fullname" . }}-config
  labels:
    {{- include "vibed.labels" . | nindent 4 }}
data:
  vibed.yaml: |
    server:
      transport: {{ .Values.config.server.transport | quote }}
      httpAddr: {{ .Values.config.server.httpAddr | quote }}
      baseURL: {{ .Values.config.server.baseURL | default "" | quote }}
      rateLimit:
        enabled: {{ .Values.config.server.rateLimit.enabled | default false }}
        requestsPerSecond: {{ .Values.config.server.rateLimit.requestsPerSecond | default 10 }}
        burst: {{ int (.Values.config.server.rateLimit.burst | default 20) }}
    {{- if .Values.auth.enabled }}
    auth:
      enabled: true
      mode: {{ .Values.auth.mode | quote }}
      {{- if eq .Values.auth.mode "apikey" }}
      apiKeys:
        - key: "env:VIBED_AUTH_API_KEY"
          name: {{ .Values.auth.apiKeyName | default "helm-configured" | quote }}
          role: {{ .Values.auth.apiKeyRole | default "admin" | quote }}
      {{- end }}
      {{- if eq .Values.auth.mode "oidc" }}
      oidc:
        issuer: {{ .Values.auth.oidc.issuer | quote }}
        audience: {{ .Values.auth.oidc.audience | quote }}
        usernameClaim: {{ .Values.auth.oidc.usernameClaim | quote }}
        emailClaim: {{ .Values.auth.oidc.emailClaim | quote }}
        roleClaim: {{ .Values.auth.oidc.roleClaim | quote }}
        adminRole: {{ .Values.auth.oidc.adminRole | quote }}
        scopes:
        {{- range .Values.auth.oidc.scopes }}
          - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.auth.tls.enabled }}
      tls:
        enabled: true
        certFile: "/etc/vibed/tls/tls.crt"
        keyFile: "/etc/vibed/tls/tls.key"
      {{- end }}
    {{- end }}
    deployment:
      preferredTarget: {{ .Values.config.deployment.preferredTarget | quote }}
      namespace: {{ .Values.config.deployment.namespace | quote }}
      readyTimeout: {{ .Values.config.deployment.readyTimeout | default "10m" | quote }}
    builder:
      engine: {{ .Values.config.builder.engine | quote }}
      image: {{ .Values.config.builder.image | quote }}
      pullPolicy: {{ .Values.config.builder.pullPolicy | quote }}
      containerRuntime: {{ .Values.config.builder.containerRuntime | quote }}
      {{- if eq .Values.config.builder.engine "buildah" }}
      buildah:
        image: {{ .Values.config.builder.buildah.image | quote }}
        timeout: {{ .Values.config.builder.buildah.timeout | quote }}
        insecure: {{ .Values.config.builder.buildah.insecure }}
        namespace: {{ .Release.Namespace | quote }}
        pvcName: {{ printf "%s-data" (include "vibed.fullname" .) | quote }}
      {{- end }}
    storage:
      backend: {{ .Values.config.storage.backend | quote }}
      local:
        basePath: {{ .Values.config.storage.local.basePath | quote }}
    registry:
      enabled: {{ .Values.config.registry.enabled }}
      {{- if .Values.config.registry.url }}
      url: {{ .Values.config.registry.url | quote }}
      {{- end }}
      insecure: {{ .Values.config.registry.insecure | default false }}
    store:
      backend: {{ .Values.config.store.backend | quote }}
      sqlite:
        path: {{ .Values.config.store.sqlite.path | default "/data/vibed/vibed.db" | quote }}
      configmap:
        name: {{ .Values.config.store.configmap.name | quote }}
        namespace: {{ default .Release.Namespace .Values.config.store.configmap.namespace | quote }}
    limits:
      maxTotalFileSize: {{ int .Values.config.limits.maxTotalFileSize }}
      maxFileCount: {{ int .Values.config.limits.maxFileCount }}
      maxLogLines: {{ int .Values.config.limits.maxLogLines }}
    tracing:
      enabled: {{ .Values.config.tracing.enabled | default false }}
      endpoint: {{ .Values.config.tracing.endpoint | default "" | quote }}
      sampleRate: {{ .Values.config.tracing.sampleRate | default 1.0 }}
    {{- with .Values.config.gc }}
    gc:
      enabled: {{ .enabled | default true }}
      interval: {{ .interval | default "5m" | quote }}
      maxAge: {{ .maxAge | default "1h" | quote }}
      dryRun: {{ .dryRun | default false }}
    {{- end }}
    {{- with .Values.config.fastPath }}
    fastPath:
      enabled: {{ .enabled | default false }}
      {{- if .namespace }}
      namespace: {{ .namespace | quote }}
      {{- end }}
      replenishInterval: {{ .replenishInterval | default "15s" | quote }}
      readyTimeout: {{ .readyTimeout | default "2m" | quote }}
      maxIdleAge: {{ .maxIdleAge | default "1h" | quote }}
      previewTTL: {{ .previewTTL | default "1h" | quote }}
      autoPromote: {{ .autoPromote | default false }}
      {{- if .agentToken }}
      agentToken: {{ .agentToken | quote }}
      {{- end }}
      {{- with .runners }}
      runners:
        {{- range $lang, $r := . }}
        {{ $lang }}:
          image: {{ $r.image | quote }}
          poolSize: {{ int ($r.poolSize | default 2) }}
          controlPort: {{ int ($r.controlPort | default 9000) }}
          appPort: {{ int ($r.appPort | default 8080) }}
          {{- with $r.resources }}
          resources:
            {{- with .limits }}
            limits:
              {{- if .cpu }}
              cpu: {{ .cpu | quote }}
              {{- end }}
              {{- if .memory }}
              memory: {{ .memory | quote }}
              {{- end }}
            {{- end }}
            {{- with .requests }}
            requests:
              {{- if .cpu }}
              cpu: {{ .cpu | quote }}
              {{- end }}
              {{- if .memory }}
              memory: {{ .memory | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
