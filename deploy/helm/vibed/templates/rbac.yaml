apiVersion: rbac.authorization.k8s.io/v1
# These permissions apply to vibeD's deploy *target* namespace (configurable via
# config.deployment.namespace), not to vibeD's own namespace. ClusterRole +
# ClusterRoleBinding so vibeD can deploy into any namespace it's pointed at.
kind: ClusterRole
metadata:
  name: {{ include "vibed.fullname" . }}
  labels:
    {{- include "vibed.labels" . | nindent 4 }}
rules:
  # --- Read-only: pod inspection and log retrieval ---
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

  # --- Events: surfacing pod/Knative failure reasons (ImagePullBackOff,
  #     PSA admission, etc.) when fetching pod logs returns nothing.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

  # --- Secrets: for validating secret references during deploy ---
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

  # --- Services: vibeD creates/manages K8s Services for deployed artifacts ---
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]

  # --- ConfigMaps: artifact store + static file deployments ---
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]

  # --- Deployments: plain Kubernetes deployment target ---
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]

  # --- Build Jobs: Buildah container image builds ---
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # --- Knative Serving: serverless deployment target.
  #     Services for CRUD; revisions/routes/configurations read-only so
  #     waitForReady can surface the underlying revision failure reason
  #     instead of just the rolled-up Service condition.
  - apiGroups: ["serving.knative.dev"]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["serving.knative.dev"]
    resources: ["revisions", "routes", "configurations"]
    verbs: ["get", "list", "watch"]

  # --- agent-sandbox: BYOC + Sandbox CR target. Without these the
  #     SandboxDeployer 403s silently and BYOC deploys never succeed.
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxclaims", "sandboxwarmpools"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vibed.fullname" . }}
  labels:
    {{- include "vibed.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vibed.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vibed.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vibed.fullname" . }}-crd-reader
  labels:
    {{- include "vibed.labels" . | nindent 4 }}
rules:
  # --- Namespace creation: for multi-tenant departments ---
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # --- CRD detection: auto-detect available deployment targets ---
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vibed.fullname" . }}-crd-reader
  labels:
    {{- include "vibed.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vibed.fullname" . }}-crd-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "vibed.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
