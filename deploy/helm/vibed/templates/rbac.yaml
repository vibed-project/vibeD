apiVersion: rbac.authorization.k8s.io/v1
# These permissions apply to vibeD's deploy *target* namespace (configurable via
# config.deployment.namespace), not to vibeD's own namespace. ClusterRole +
# ClusterRoleBinding so vibeD can deploy into any namespace it's pointed at.
kind: ClusterRole
metadata:
  name: {{ include "vibed.fullname" . }}
  labels:
    {{- include "vibed.labels" . | nindent 4 }}
rules:
  # --- Read-only: pod inspection and log retrieval ---
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

  # --- Events: surfacing pod failure reasons (ImagePullBackOff,
  #     PSA admission, etc.) when fetching pod logs returns nothing.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

  # --- Secrets: intentionally NOT granted. This ClusterRole is cluster-scoped,
  #     so a secrets get/list here reads EVERY Secret in the cluster. It was
  #     added for "validating secret references during deploy", but no code path
  #     ever called the Secret API (spec.secretRefs is passed to the workload,
  #     not resolved here), so the grant was pure standing privilege. If
  #     reference validation is implemented later, scope it to a Role in the
  #     deploy namespace — never cluster-wide.

  # --- Services: vibeD creates/manages K8s Services for deployed artifacts ---
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]

  # --- ConfigMaps: artifact store + static file deployments ---
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]

  # --- Deployments: intentionally NOT granted. The plain-Kubernetes deploy
  #     target was removed with the orchestrator in v0.6.0; nothing references
  #     appsv1.Deployment any more, so create/update/delete on every namespace
  #     was standing write privilege with no caller.

  # --- Jobs: intentionally NOT granted. These existed to sweep Jobs left by
  #     the in-cluster image builder, removed in v0.4.1; no code references
  #     batchv1.Job today. Any cluster still holding such Jobs predates v0.4.1
  #     and can be swept once by an operator.

  # --- agent-sandbox: BYOC + Sandbox CR target, and the Instant Preview
  #     fast-path warm runner pool. Without these the SandboxDeployer 403s
  #     silently and the pool can't create/recycle runner Sandboxes. The full
  #     verb set covers pool churn (create/delete), the GC sweep (list/delete),
  #     and the SandboxDeployer (create/update/delete/get).
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxclaims", "sandboxwarmpools"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]

  # --- VibedApp: the /v1/deploy path (deploy.Service) creates and manages
  #     these CRs; the controller reconciles them. The server reads back
  #     status while watching a deploy to Ready.
  - apiGroups: ["vibed.dev"]
    resources: ["vibedapps"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["vibed.dev"]
    resources: ["vibedapps/status"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vibed.fullname" . }}
  labels:
    {{- include "vibed.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vibed.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vibed.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vibed.fullname" . }}-crd-reader
  labels:
    {{- include "vibed.labels" . | nindent 4 }}
rules:
  # --- Namespace creation: for multi-tenant departments ---
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # --- CRD detection: auto-detect available deployment targets ---
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vibed.fullname" . }}-crd-reader
  labels:
    {{- include "vibed.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vibed.fullname" . }}-crd-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "vibed.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
