{{- if .Values.egressControl.enabled }}
{{- $fullName := include "vibed.fullname" . }}
{{- $sa := printf "%s-egress-authz" $fullName }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibed.labels" . | nindent 4 }}
    app.kubernetes.io/component: egress-authz
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullName }}-egress-authz
  labels:
    {{- include "vibed.labels" . | nindent 4 }}
rules:
  # Resolve a source pod IP -> the owning VibedApp's egress allow-list.
  - apiGroups: ["vibed.dev"]
    resources: ["vibedapps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}-egress-authz
  labels:
    {{- include "vibed.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullName }}-egress-authz
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-egress-authz
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibed.labels" . | nindent 4 }}
    app.kubernetes.io/component: egress-authz
spec:
  replicas: {{ .Values.egressControl.authz.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "vibed.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: egress-authz
  template:
    metadata:
      labels:
        {{- include "vibed.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: egress-authz
    spec:
      serviceAccountName: {{ $sa }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: authz
          image: "{{ .Values.egressControl.authz.image.repository }}:{{ .Values.egressControl.authz.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.egressControl.authz.image.pullPolicy | default "IfNotPresent" }}
          args:
            - --namespace={{ .Values.namespaces.apps }}
            {{- /*
              systemHosts: operator-declared always-allowed hosts (S3 endpoint,
              package mirrors, etc.). When tarball.backend=served the in-cluster
              source store is reached through the egress proxy too — same
              HTTP_PROXY env path as everything else — so auto-include the
              served Service DNS unless the operator already listed it. Without
              this, served + egressControl quietly 403s every source pull and
              deploys never leave Starting.
            */}}
            {{- $systemHosts := .Values.egressControl.systemHosts | default list }}
            {{- $backend := .Values.config.storage.tarball.backend | default "served" }}
            {{- if eq $backend "served" }}
              {{- $servedHost := printf "%s.%s.svc.cluster.local" (include "vibed.fullname" .) .Release.Namespace }}
              {{- if not (has $servedHost $systemHosts) }}
                {{- $systemHosts = append $systemHosts $servedHost }}
              {{- end }}
            {{- else if eq $backend "s3" }}
              {{- /* The agent pulls the presigned source tarball through the same
                     HTTP_PROXY path, so the S3 endpoint host must be allowed or
                     every pull 403s. Auto-add it from the configured endpoint
                     unless the operator already listed it. */}}
              {{- with .Values.config.storage.tarball.s3.endpoint }}
                {{- $s3Host := (urlParse .).host }}
                {{- if and $s3Host (not (has $s3Host $systemHosts)) }}
                  {{- $systemHosts = append $systemHosts $s3Host }}
                {{- end }}
              {{- end }}
            {{- end }}
            - --system-hosts={{ join "," $systemHosts }}
          ports:
            - { name: authz, containerPort: 8090 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-egress-authz
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibed.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "vibed.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: egress-authz
  ports:
    - { name: authz, port: 8090, targetPort: authz }
{{- end }}
