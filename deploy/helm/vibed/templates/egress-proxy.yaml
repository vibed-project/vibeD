{{- if .Values.egressControl.enabled }}
{{- $fullName := include "vibed.fullname" . }}
{{- $authz := printf "http://%s-egress-authz.%s:8090" $fullName .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-egress-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibed.labels" . | nindent 4 }}
data:
  squid.conf: |
    http_port 3128
    # Don't advertise the proxy or leak the client.
    via off
    forwarded_for delete
    httpd_suppress_version_string on

    # Per-connection authorization: ask vibed-egress-authz whether this source
    # pod may reach the requested host. %SRC = client IP, %URI = full request
    # URL (host:port for CONNECT). Note: %>ru is a log_format token, NOT an
    # external_acl_type token — Squid silently substitutes "-" for it and
    # shifts the rest, so the helper saw {URL, "-"} instead of {SRC, URL}
    # and every request was denied with host="-". Use %URI for external_acl.
    # Fail-closed.
    external_acl_type vibed_egress ttl=5 negative_ttl=5 grace=0 %SRC %URI /usr/local/bin/vibed-egress-authz squid-helper --authz-url={{ $authz }}
    acl vibed_egress_ok external vibed_egress

    acl CONNECT method CONNECT
    {{- /*
      Safe_ports gates all traffic before the authz helper runs. Default is
      80 + 443 (public HTTP/HTTPS). When tarball.backend=served the in-cluster
      source store lives on .Values.service.port (default 8080), so the
      runner-agent's source pull would 403 here before authz could ever say
      "yes." Conditionally widen Safe_ports to include that port — only when
      served is the active backend, so production (s3) stays on 80/443.
    */}}
    {{- if eq (.Values.config.storage.tarball.backend | default "served") "served" }}
    acl Safe_ports port 80 443 {{ .Values.service.port | default 8080 }}
    {{- else }}
    acl Safe_ports port 80 443
    {{- end }}
    acl SSL_ports port 443
    http_access deny !Safe_ports
    http_access deny CONNECT !SSL_ports

    # The gate: allow only what the authz service permits, then default-deny.
    http_access allow vibed_egress_ok
    http_access deny all

    # Filtering proxy, not a cache.
    cache deny all
    access_log stdio:/dev/stdout
    cache_log stdio:/dev/stderr

    # DNS-rebinding mitigation: Squid does its own DNS lookup after the authz
    # service approves a hostname. Without TTL clamping, an attacker's
    # authoritative resolver can return the allow-listed host's IP to authz
    # and a private IP to Squid's CONNECT in the same conversation. Holding
    # positive answers for an hour collapses the rebinding window; negative
    # answers stay short so legitimate DNS changes propagate.
    positive_dns_ttl 1 hour
    negative_dns_ttl 5 minutes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-egress-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibed.labels" . | nindent 4 }}
    app.kubernetes.io/component: egress-proxy
spec:
  replicas: {{ .Values.egressControl.proxy.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "vibed.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: egress-proxy
  template:
    metadata:
      labels:
        {{- include "vibed.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: egress-proxy
    spec:
      automountServiceAccountToken: false
      # ubuntu/squid execs the squid binary as uid 13 (proxy) but the image's
      # USER is root. Pin runAsUser to 13 so runAsNonRoot is enforceable, and
      # fsGroup 13 makes the emptyDir mounts writable by the proxy group.
      securityContext:
        runAsNonRoot: true
        runAsUser: 13
        runAsGroup: 13
        fsGroup: 13
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: squid
          image: "{{ .Values.egressControl.proxy.image.repository }}:{{ .Values.egressControl.proxy.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.egressControl.proxy.image.pullPolicy | default "IfNotPresent" }}
          command: ["squid", "-N", "-f", "/etc/squid/squid.conf"]
          ports:
            - { name: proxy, containerPort: 3128 }
          volumeMounts:
            - { name: conf, mountPath: /etc/squid/squid.conf, subPath: squid.conf }
            - { name: spool, mountPath: /var/spool/squid }
            - { name: run, mountPath: /var/run }
            - { name: logs, mountPath: /var/log/squid }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: "1", memory: 256Mi }
      volumes:
        - name: conf
          configMap: { name: {{ $fullName }}-egress-proxy }
        - { name: spool, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: logs, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-egress-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibed.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "vibed.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: egress-proxy
  ports:
    - { name: proxy, port: 3128, targetPort: proxy }
{{- end }}
