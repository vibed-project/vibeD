{{- /*
The v0.3.1 data plane lives in two namespaces (refactor.md §7.1):
  vibed-pools — SandboxWarmPool / SandboxTemplate resources + warm sandboxes
  vibed-apps  — claimed sandboxes serving traffic + VibedApp CRs
The control plane (this release) stays in .Release.Namespace.
Disable with namespaces.create=false if you manage them out of band.
*/ -}}
{{- if .Values.namespaces.create }}
{{- range $ns := list .Values.namespaces.pools .Values.namespaces.apps }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "vibed.labels" $ | nindent 4 }}
    vibed.dev/managed: "true"
{{- end }}
{{- end }}
