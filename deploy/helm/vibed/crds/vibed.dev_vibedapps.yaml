---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: vibedapps.vibed.dev
spec:
  group: vibed.dev
  names:
    kind: VibedApp
    listKind: VibedAppList
    plural: vibedapps
    shortNames:
    - vapp
    singular: vibedapp
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .spec.runtime.template
      name: Runtime
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VibedApp is a user-deployed application.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VibedAppSpec is the desired state of a VibedApp.
            properties:
              egress:
                description: Egress is the per-app outbound allow-list enforced by
                  the egress proxy.
                properties:
                  allowedHosts:
                    description: |-
                      AllowedHosts are the destination hostnames the app may reach, e.g.
                      "api.openai.com". A leading "*." wildcard matches one or more leading
                      labels ("*.example.com" matches "a.example.com"). Matched on the CONNECT
                      host / HTTP Host by the egress proxy.
                    items:
                      type: string
                    type: array
                type: object
              owner:
                description: |-
                  Owner is the authenticated user identity (email or OIDC subject) that
                  created the app. Used for AuthZ and per-user quota.
                type: string
              resources:
                description: Resources caps CPU/memory for the user process.
                properties:
                  cpu:
                    default: 500m
                    type: string
                  memory:
                    default: 256Mi
                    type: string
                type: object
              runtime:
                description: Runtime selects the lane and template.
                properties:
                  entrypoint:
                    description: Entrypoint overrides the autodetected start command
                      in vibed-agent.
                    type: string
                  env:
                    description: Env are environment variables exposed to the user
                      process.
                    items:
                      description: EnvVar is a single environment variable passed
                        to the user process.
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  lane:
                    description: |-
                      Lane is the runtime track; the classifier picks this and the user
                      override is rare.
                    enum:
                    - fast
                    - general
                    type: string
                  template:
                    description: |-
                      Template names the prebaked template (e.g. node-24, python-313,
                      static-nginx). Empty falls back to the classifier's default for the
                      lane.
                    type: string
                required:
                - lane
                type: object
              source:
                description: Source points to the app's code.
                properties:
                  gitRef:
                    description: GitRef is an optional git URL + commit used instead
                      of a tarball.
                    type: string
                  tarballRef:
                    description: TarballRef is an S3 URL to the gzipped tarball of
                      the app source.
                    type: string
                type: object
              ttl:
                default: 30m
                description: |-
                  TTL is the idle TTL before suspend-to-snapshot. Accepts Go duration
                  syntax ("30m", "1h"); validated by the controller.
                type: string
            required:
            - owner
            - runtime
            - source
            type: object
          status:
            description: VibedAppStatus is the observed state of a VibedApp.
            properties:
              conditions:
                description: |-
                  Conditions reports detailed status using the standard metav1.Condition
                  shape, so consumers can match on Type/Status/Reason.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastDeployedAt:
                description: LastDeployedAt is when the app last transitioned to Ready.
                format: date-time
                type: string
              phase:
                description: Phase is the coarse-grained lifecycle state.
                enum:
                - Pending
                - Claiming
                - Starting
                - Ready
                - Suspended
                - Failed
                type: string
              podIP:
                description: |-
                  PodIP is the in-cluster IP of the bound Sandbox pod, populated once a
                  SandboxClaim has been bound. The controller uses this to reach
                  vibed-agent's control API (port 9000) and to inject source. Cleared on
                  Suspended. NOTE: a raw pod IP goes stale when the Sandbox pod is
                  recreated, so it is NOT the routing target — see RouteTarget.
                type: string
              routeTarget:
                description: |-
                  RouteTarget is the stable upstream ("host:port") vibed-router proxies
                  to. For general-lane apps it's the cluster-DNS name of the per-app
                  Service (which re-selects the bound pod across restarts, so it survives
                  pod-IP churn); for the workerd fast lane it's the worker's host:port.
                  Empty until Ready. The router falls back to PodIP when this is unset.
                type: string
              sandboxRef:
                description: SandboxRef references the agent-sandbox Sandbox CR backing
                  this app.
                type: string
              snapshotRef:
                description: |-
                  SnapshotRef is the S3 URL of the latest Firecracker snapshot. Empty
                  when no snapshot has been taken yet; populated on first suspend and
                  used to fast-path redeploys via snapshot-restore.
                type: string
              url:
                description: |-
                  URL is the publicly resolvable URL of the running app, set once the
                  router has wired a route. Empty in Pending/Claiming/Starting.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
