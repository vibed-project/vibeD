openapi: 3.0.3
info:
  title: vibeD API
  version: v1alpha1
  description: |
    HTTP API for vibeD, the workload orchestrator for GenAI-generated artifacts.

    The deploy contract is the load-bearing one: `POST /v1/deploy` must return
    within 10 s with either:
      * `200 OK` + the final URL (happy path; warm pool absorbs the request), or
      * `202 Accepted` + a `status_url` to poll when the classifier picked a
        slow path (e.g., a runtime that requires an async template build).

    Source of truth for this file is committed; Go server stubs are generated
    by oapi-codegen via `make openapi-gen`. Do not edit
    `pkg/vibedapi/http/*.gen.go` by hand.

servers:
  - url: https://vibed.example.com
    description: Production
  - url: http://localhost:8080
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: deploy
    description: Deploy + lifecycle endpoints.
  - name: apps
    description: Read + manage existing apps.
  - name: templates
    description: Available runtime templates.
  - name: ops
    description: Liveness, readiness, metrics.

paths:
  /v1/deploy:
    post:
      tags: [deploy]
      operationId: deployApp
      summary: Deploy a new app.
      description: |
        Multipart upload: a gzipped tarball of the source tree plus a JSON
        `metadata` blob. The classifier picks the lane and template; an
        explicit `runtime.lane` or `runtime.template` in metadata is an
        override.

        Latency contract: this endpoint MUST return within 10 s.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [source, metadata]
              properties:
                source:
                  type: string
                  format: binary
                  description: gzipped tarball of the app source (≤ 50 MB).
                metadata:
                  $ref: '#/components/schemas/DeployMetadata'
      responses:
        '200':
          description: Deployed; app is Ready and the URL is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployResponse'
        '202':
          description: |
            Accepted onto a slow path. The app is not yet Ready; poll
            `status_url` until `phase: Ready` or `phase: Failed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: Tarball too large (limit 50 MB).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Internal' }

  /v1/apps:
    get:
      tags: [apps]
      operationId: listApps
      summary: List apps owned by the authenticated user.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: >-
            Maximum number of apps to return. Omitted or <= 0 returns every
            app (backward compatible with pre-pagination clients).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
          description: >-
            Number of apps to skip before the first returned item. Negative
            values are treated as 0.
      responses:
        '200':
          description: List of apps.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/App' }
                  total:
                    type: integer
                    description: >-
                      Total number of apps visible to the caller after
                      ownership/authorization filtering, before limit/offset
                      slicing.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/apps/{app_id}:
    parameters:
      - $ref: '#/components/parameters/AppID'
    get:
      tags: [apps]
      operationId: getApp
      summary: Get app status and URL.
      responses:
        '200':
          description: App found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [apps]
      operationId: deleteApp
      summary: Tear down an app.
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/apps/{app_id}/redeploy:
    parameters:
      - $ref: '#/components/parameters/AppID'
    post:
      tags: [apps]
      operationId: redeployApp
      summary: Redeploy with new source.
      description: |
        Uses snapshot-restore when `status.snapshot_ref` is populated and the
        template hasn't changed; otherwise falls back to a fresh claim.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  type: string
                  format: binary
                metadata:
                  $ref: '#/components/schemas/DeployMetadata'
      responses:
        '200':
          description: Redeployed; app is Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeployResponse' }
        '202':
          description: Accepted; poll status_url.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeployResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/apps/{app_id}/suspend:
    parameters:
      - $ref: '#/components/parameters/AppID'
    post:
      tags: [apps]
      operationId: suspendApp
      summary: Suspend an app, freeing its compute.
      description: |
        Releases the app's warm-pool pod and parks it in the Suspended phase.
        In-memory state is not preserved; resume re-materializes from source.
      responses:
        '202':
          description: Suspend initiated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/apps/{app_id}/resume:
    parameters:
      - $ref: '#/components/parameters/AppID'
    post:
      tags: [apps]
      operationId: resumeApp
      summary: Resume a suspended app, re-claiming compute.
      description: |
        Clears the suspended state so the controller re-claims a warm-pool pod
        and re-injects the app's source, returning it to Ready.
      responses:
        '202':
          description: Resume initiated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/apps/{app_id}/logs:
    parameters:
      - $ref: '#/components/parameters/AppID'
    get:
      tags: [apps]
      operationId: streamAppLogs
      summary: Stream logs from the app's runner via SSE.
      responses:
        '200':
          description: Server-Sent Events stream of log lines.
          content:
            text/event-stream:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/apps/{app_id}/versions:
    parameters:
      - $ref: '#/components/parameters/AppID'
    get:
      tags: [apps]
      operationId: getAppVersions
      summary: List the app's deploy history (newest first).
      responses:
        '200':
          description: Deploy history.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Version' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/apps/{app_id}/rollback:
    parameters:
      - $ref: '#/components/parameters/AppID'
    post:
      tags: [apps]
      operationId: rollbackApp
      summary: Re-deploy a previous version's retained source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
      responses:
        '200':
          description: Rolled back; app is Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeployResponse' }
        '202':
          description: Accepted; poll status_url.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeployResponse' }
        '400':
          description: The requested version is not available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/apps/{app_id}/share-links:
    parameters:
      - $ref: '#/components/parameters/AppID'
    post:
      tags: [apps]
      operationId: createShareLink
      summary: Mint a public share link for an app.
      description: |
        Creates a public, optionally password-protected link to an app the
        authenticated user owns. The returned token is the credential.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: >-
                    Optional password gate. Omitted or empty mints a link that
                    requires no password.
                expires_in:
                  type: string
                  description: >-
                    Optional lifetime as a Go duration (e.g. "24h"). A "d"
                    suffix is accepted as days (e.g. "7d"). Omitted or empty
                    mints a link that never expires.
      responses:
        '200':
          description: Share link created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [apps]
      operationId: listShareLinks
      summary: List an app's share links.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: >-
            Maximum number of share links to return. Omitted or <= 0 returns
            every link (backward compatible with pre-pagination clients).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
          description: >-
            Number of share links to skip before the first returned item.
            Negative values are treated as 0.
      responses:
        '200':
          description: List of share links.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ShareLink' }
                  total:
                    type: integer
                    description: >-
                      Total number of share links for the app, before
                      limit/offset slicing.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/templates:
    get:
      tags: [templates]
      operationId: listTemplates
      summary: List available runtime templates.
      responses:
        '200':
          description: List of templates.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Template' }

  /healthz:
    get:
      tags: [ops]
      operationId: healthz
      summary: Liveness probe.
      security: []
      responses:
        '200': { description: alive }
        '503': { description: dead }

  /readyz:
    get:
      tags: [ops]
      operationId: readyz
      summary: Readiness probe.
      security: []
      responses:
        '200': { description: ready }
        '503': { description: not ready }

  /metrics:
    get:
      tags: [ops]
      operationId: metrics
      summary: Prometheus metrics.
      security: []
      responses:
        '200':
          description: Prometheus exposition format.
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC bearer token issued by vibed-api after OIDC login.

  parameters:
    AppID:
      name: app_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9-]{1,63}$'

  schemas:
    DeployMetadata:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Human-readable name; URL-safe slug derived from it.
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          maxLength: 63
        runtime:
          $ref: '#/components/schemas/RuntimeOverride'
        egress:
          $ref: '#/components/schemas/EgressPolicy'
        env:
          type: array
          items: { $ref: '#/components/schemas/EnvVar' }
        ttl:
          type: string
          description: Idle TTL before suspend-to-snapshot (Go duration).
          default: "30m"

    RuntimeOverride:
      type: object
      description: |
        Optional override for the classifier. Setting `lane` or `template`
        bypasses lane/template selection; setting `entrypoint` overrides the
        agent's autodetection.
      properties:
        lane:
          type: string
          enum: [fast, general]
        template:
          type: string
        entrypoint:
          type: string

    EgressPolicy:
      type: object
      description: |
        Per-app outbound allow-list. The egress proxy default-denies; only
        these hosts (plus vibeD's system hosts) are reachable. Omitting it (or
        an empty list) means no external egress.
      properties:
        allowed_hosts:
          type: array
          description: 'Destination hostnames, e.g. "api.openai.com" or "*.example.com".'
          items: { type: string }

    EnvVar:
      type: object
      required: [name]
      properties:
        name:  { type: string }
        value: { type: string }

    DeployResponse:
      type: object
      required: [app_id]
      properties:
        app_id:     { type: string }
        url:        { type: string, format: uri }
        status_url: { type: string, format: uri }

    Version:
      type: object
      required: [version, timestamp]
      properties:
        version:          { type: integer }
        timestamp:        { type: string, format: date-time }
        template:         { type: string }
        lane:             { type: string }
        source_hash:      { type: string }
        rolled_back_from: { type: integer }

    ShareLink:
      type: object
      description: A public, optionally password-protected link to an app.
      required: [token, artifact_id, created_by, has_password, created_at, revoked]
      properties:
        token:        { type: string, description: The credential; a link resolves via this token. }
        artifact_id:  { type: string, description: The app the link points at. }
        created_by:   { type: string, description: Owner who minted the link. }
        has_password: { type: boolean, description: Whether resolving requires a password. }
        expires_at:   { type: string, format: date-time, description: Expiry instant; absent means it never expires. }
        created_at:   { type: string, format: date-time }
        revoked:      { type: boolean }
        url:          { type: string, format: uri, description: Public share URL; absent when no public origin is configured. }

    Phase:
      type: string
      enum: [Pending, Claiming, Starting, Ready, Suspended, Failed]

    App:
      type: object
      required: [app_id, phase]
      properties:
        app_id:           { type: string }
        name:             { type: string }
        owner:            { type: string }
        phase:            { $ref: '#/components/schemas/Phase' }
        reason:
          type: string
          description: >
            Short CamelCase reason for the current phase, from the Ready
            condition (e.g. TemplateMissing). Machine-readable; stable.
        message:
          type: string
          description: >
            Human-readable explanation of the current phase, from the Ready
            condition. On a failed deploy this carries why it failed (e.g. no
            warm pool for the required template) — often the only diagnosis
            available, since a deploy that never gets a pod has no logs.
        url:              { type: string, format: uri }
        runtime:
          type: object
          properties:
            lane:       { type: string, enum: [fast, general] }
            template:   { type: string }
        last_deployed_at: { type: string, format: date-time }

    Template:
      type: object
      required: [name, lane]
      properties:
        name:        { type: string }
        lane:        { type: string, enum: [fast, general] }
        description: { type: string }
        warm_pool_size:
          type: integer
          description: Current warm pool size for this template.

    Error:
      type: object
      required: [code, message]
      properties:
        code:    { type: string, description: stable machine-readable code }
        message: { type: string, description: human-readable description }
        details: { type: object, additionalProperties: true }

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid auth.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Internal:
      description: Internal server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
