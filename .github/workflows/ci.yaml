name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ORG: vibed-project

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Build
        run: CGO_ENABLED=0 go build -o bin/vibed ./cmd/vibed

      - name: Test
        run: go test ./... -short -count=1

  # Build and push the control-plane images on merge to main (not on PRs).
  # Template/runner images are built separately in runner-images.yaml.
  container:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: vibed,                dockerfile: Dockerfile }
          - { image: vibed-controller,     dockerfile: cmd/vibed-controller/Dockerfile }
          - { image: vibed-router,         dockerfile: cmd/vibed-router/Dockerfile }
          - { image: vibed-workerd-loader, dockerfile: cmd/vibed-workerd-loader/Dockerfile }
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute tags in shell (not docker/metadata-action, whose API-backed
      # label enrichment intermittently fails with "Bad credentials").
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          img="${REGISTRY}/${ORG}/${{ matrix.image }}"
          {
            echo "tags<<EOF"
            echo "${img}:latest"
            echo "${img}:main"
            echo "${img}:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
