name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  ORG: vibed-project

jobs:
  # Build + push every image (control plane + templates) with the release's
  # semver tags. The chart's appVersion is bumped to match, so a `helm install`
  # of the published chart pulls these images by default.
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: vibed,                       dockerfile: Dockerfile }
          - { image: vibed-controller,            dockerfile: cmd/vibed-controller/Dockerfile }
          - { image: vibed-router,                dockerfile: cmd/vibed-router/Dockerfile }
          - { image: vibed-workerd-loader,        dockerfile: cmd/vibed-workerd-loader/Dockerfile }
          - { image: vibed-runner-node,           dockerfile: templates/node-24/Dockerfile }
          - { image: vibed-runner-python,         dockerfile: templates/python-313/Dockerfile }
          - { image: vibed-template-go-123,       dockerfile: templates/go-123/Dockerfile }
          - { image: vibed-template-base-al2023,  dockerfile: templates/base-al2023/Dockerfile }
          - { image: vibed-template-static-nginx, dockerfile: templates/static-nginx/Dockerfile }
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute tags in shell rather than docker/metadata-action: that action
      # makes a GitHub API call to enrich OCI labels which intermittently
      # returns "Bad credentials" and hard-fails the build. Shell is
      # deterministic and needs no API.
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          img="${REGISTRY}/${ORG}/${{ matrix.image }}"
          v="${GITHUB_REF_NAME#v}"
          {
            echo "tags<<EOF"
            echo "${img}:${v}"
            # major.minor only for a clean (non-prerelease) semver tag
            if [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "${img}:${v%.*}"; fi
            echo "${img}:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          platforms: linux/amd64,linux/arm64

  # Package the Helm chart at the release version, push it to GHCR as an OCI
  # artifact, and publish the GitHub Release with the chart attached.
  chart-release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (Helm OCI)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: |
          helm package deploy/helm/vibed/ \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.version }}" \
            --destination dist/

      - name: Push chart to GHCR
        run: helm push dist/vibed-${{ steps.ver.outputs.version }}.tgz oci://${{ env.REGISTRY }}/${{ env.ORG }}/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          files: dist/vibed-${{ steps.ver.outputs.version }}.tgz
          body: |
            ## Install

            ```bash
            helm install vibed oci://${{ env.REGISTRY }}/${{ env.ORG }}/charts/vibed \
              --version ${{ steps.ver.outputs.version }} \
              -n vibed-system --create-namespace
            ```

            Container images (pushed to `${{ env.REGISTRY }}/${{ env.ORG }}/*:${{ steps.ver.outputs.version }}`):
            vibed, vibed-controller, vibed-router, vibed-workerd-loader, and the
            template images (vibed-runner-node, vibed-runner-python,
            vibed-template-go-123, vibed-template-base-al2023, vibed-template-static-nginx).
