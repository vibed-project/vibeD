name: Runner Images

# The per-template warm-pool images (one per template under templates/). Each
# embeds vibed-agent and is built once and pushed to GHCR — only when the
# template definitions or the runner-agent source change, not on every merge.

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'cmd/vibed-agent/**'
      - 'internal/runneragent/**'
      - 'internal/appspec/**'
      - 'pkg/vibedapi/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/runner-images.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runner:
          - name: node
            image: vibed-project/vibed-runner-node
            dockerfile: templates/node-24/Dockerfile
          - name: python
            image: vibed-project/vibed-runner-python
            dockerfile: templates/python-313/Dockerfile
          - name: go
            image: vibed-project/vibed-template-go-123
            dockerfile: templates/go-123/Dockerfile
          - name: base
            image: vibed-project/vibed-template-base-al2023
            dockerfile: templates/base-al2023/Dockerfile
          - name: static-nginx
            image: vibed-project/vibed-template-static-nginx
            dockerfile: templates/static-nginx/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.runner.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.runner.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.runner.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner.name }}
          platforms: linux/amd64,linux/arm64
