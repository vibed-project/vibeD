name: Runner Images

# The per-template warm-pool images (one per template under templates/). Each
# embeds vibed-agent. On merge to main (and on demand) they are built and
# pushed to GHCR; on a PR that touches template or agent code they are built
# only (single-arch, no push) so a broken Dockerfile is caught before merge.
# Path-filtered so unrelated PRs don't pay the build cost.

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'cmd/vibed-agent/**'
      - 'internal/runneragent/**'
      - 'internal/appspec/**'
      - 'pkg/vibedapi/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/runner-images.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'templates/**'
      - 'cmd/vibed-agent/**'
      - 'internal/runneragent/**'
      - 'internal/appspec/**'
      - 'pkg/vibedapi/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/runner-images.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runner:
          - name: node
            image: vibed-project/vibed-runner-node
            dockerfile: templates/node-24/Dockerfile
          - name: python
            image: vibed-project/vibed-runner-python
            dockerfile: templates/python-313/Dockerfile
          - name: go
            image: vibed-project/vibed-template-go-123
            dockerfile: templates/go-123/Dockerfile
          - name: base
            image: vibed-project/vibed-template-base-al2023
            dockerfile: templates/base-al2023/Dockerfile
          - name: static-nginx
            image: vibed-project/vibed-template-static-nginx
            dockerfile: templates/static-nginx/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # On PRs we only build to validate the Dockerfile — no push, so no
      # registry login needed (and fork PRs couldn't push anyway).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute tags in shell (not docker/metadata-action, whose API-backed
      # label enrichment intermittently fails with "Bad credentials").
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          img="${REGISTRY}/${{ matrix.runner.image }}"
          {
            echo "tags<<EOF"
            echo "${img}:latest"
            echo "${img}:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.runner.dockerfile }}
          # PR: build-only validation. Push on merge to main / manual dispatch.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.runner.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner.name }}
          # PR: amd64 only (fast). main/dispatch: full multi-arch.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
